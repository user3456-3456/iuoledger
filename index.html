<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IOU ledger - Dashboard</title>
     <link rel="preconnect" href="https://fonts.googleapis.com">
     <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
     <link href="https://fonts.googleapis.com/css2?family=DynaPuff:wght@400..700&display=swap" rel="stylesheet">
     <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <div class = "wrap bar">
            <div class="logo">IOU Ledger</div>
            <nav aria-label="Main">
                <a href="index.html" aria-current="page">Dashboard</a>
                <a href="ious.html">All IOUs</a>
                <a href="add.html">Add IOU</a>
            </nav>

        </div>
    </header>

    <main>
        <div class="wrap">
            <div class="head">
            <div>
                <h1>Dashboard</h1>
                <p class="sub">Totals count unpaid IOUs only.</p>
            </div>
            <a href="add.html" class="btn primary">Add IOU</a>
             </div>

            <!-- section tells the browser that this section is for totals -->
            <!-- the ids below are how dashboard.js finds each number -->
            <section class="stats" aria-label="Totals">
                <div class="card"><p class="lbl">Owed to me</p><p class="big" id="owed-to-me">Ksh0.00</p></div>
                <div class="card"><p class="lbl">I owe</p><p class="big" id="i-owe">Ksh0.00</p></div>
                <div class="card"><p class="lbl">Net balance</p><p class="big" id="net-balance">Ksh0.00</p></div>
            </section>

            <section class="card" aria-label="Recent IOUs">
                <div class="head" style="margin-bottom: 8px;">
                    <h2>Recent IOUs</h2>
                    <a href="ious.html">View all IOUs</a>
                </div>
                <div class="tw">
                    <table>
                        <thead>
                            <tr><th>Person</th><th>Direction</th><th>Amount</th><th>Due</th><th>Status</th></tr>
                        </thead>
                        <!-- dashboard.js fills this table body -->
                        <tbody id="recent-body"></tbody>
                    </table>
                </div>
            </section>        </div>
    </main>

    <footer>
        <div class="wrap">IOU Ledger. Your data is safe. Trust Me</div>
    </footer>
    <!-- connecting the javascript -->
     <script src="storage.js"></script>
     <script src="dashboard.js"></script>
     
</body>
</html>
