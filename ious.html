<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IOU Ledger - All IOUs</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DynaPuff:wght@400..700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
    <div class="wrap bar">
      <div class="logo"><span class="mark">IO</span>IOU Ledger</div>
      <nav aria-label="Main">
        <a href="index.html">Dashboard</a>
        <a href="ious.html" aria-current="page">All IOUs</a>
        <a href="add.html">Add IOU</a>
      </nav>
    </div>
  </header>

  <main>
    <div class="wrap">
        <div class="head">
            <div>
                <h1>All IOUs</h1>
                <p class="sub">Search, filter, mark paid or delete.</p>
            </div>
            <a href="add.html" class="btn primary">Add IOU</a>       
        </div>
    </div>

    <section class="card filters" aria-label="Search and filters">
        <div class="wide">
            <label class="lbl" for="search">Search by person</label>
            <input id="search" type="search" placeholder="Type a name...">
        </div>

        <div>
          <label class="lbl" for="direction">Direction</label>
          <select id="direction">
            <option value="all">All</option>
            <option value="in">Owes me</option>
            <option value="out">I owe</option>
          </select>
        </div>

        <div>
          <label class="lbl" for="status">Status</label>
          <select id="status">
            <option value="all">All</option>
            <option value="unpaid">Unpaid</option>
            <option value="paid">Paid</option>
          </select>
        </div>

        <button type="button" class="btn">Clear filters</button>
    </section>


    <p class="lbl" style="margin-bottom: 12px;">Showing 6 of 6 IOUs</p>
    
  </main>
    
</body>
</html>
