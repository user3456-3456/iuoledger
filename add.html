<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IOU Ledger - Add IOU</title>
      <link rel="preconnect" href="https://fonts.googleapis.com">
      <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
      <link href="https://fonts.googleapis.com/css2?family=DynaPuff:wght@400..700&display=swap" rel="stylesheet">
      <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <div class="wrap bar">
            <div class="logo"><span class="mark">IO</span>IOU Ledger</div>
            <nav aria-label="Main">
                <a href="index.html">Dashboard</a>
                <a href="ious.html">All IOUs</a>
                <a href="add.html" aria-current="page">Add IOU</a>
            </nav>
        </div>
    </header>

    <main>
        <div class="wrap">
            <div class="head">
                <div>
                    <h1>Add IOU</h1>
                    <p class="sub">Record money you lent or borrowed.</p>
                </div>
            </div>

            <div class="split">
                <section class="card main-col" aria-label="New IOU form"></section>
                 <!-- JavaScript will remove "hidden" from this message after a successful save -->
                  <p class="success" role="status" hidden>IOU saved. It now shows on your dashboard and in All IOUs.</p>

                  <form action="#">
                    <div class="field">
                        <label class="lbl" for="person">Person</label>
                        <input id="person" type="text" placeholder="e.g. Amina K.">
                        <p class="error" hidden>Enter the person's name.</p>
                    </div>

                    <div class="field">
                        <label class="lbl" for="amount">Amount</label>
                        <input id="amount" type="number" min="0" step="0.01" placeholder="0.00">
                        <p class="error" role="alert" hidden>Enter an amount greater than 0.</p>
                    </div>

                    <fieldset>
                        <legend class="lbl">Direction</legend>
                        <div class="choices">
                            <label class="choice"><input type="radio" name="direction" value="in" checked> They owe me</label>
                            <label class="choice"><input type="radio" name="direction" value="out"> I owe them</label>   
                        </div>

                    </fieldset>

                    <div class="field">
                        <label class="lbl" for="due">Due date (optional)</label>
                        <input id="due" type="date">
                    </div>

                    <div class="field">
                        <label class="lbl" for="note">Note (optional)</label>

                    </div>
                  </form>

                                      
            </div>


        </div>

    </main>


    
</body>
</html>
