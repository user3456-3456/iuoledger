<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IOU Ledger - All IOUs</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DynaPuff:wght@400..700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
    <div class="wrap bar">
      <div class="logo"><span class="mark">IO</span>IOU Ledger</div>
      <nav aria-label="Main">
        <a href="index.html">Dashboard</a>
        <a href="ious.html" aria-current="page">All IOUs</a>
        <a href="add.html">Add IOU</a>
      </nav>
    </div>
  </header>

  <main>
             <!-- everything on the page sits inside ONE .wrap so it lines up with the header -->
        <div class="wrap">
            <div class="head">
                <div>
                    <h1>All IOUs</h1>
                    <p class="sub">Search, filter, mark paid or delete.</p>
                </div>
                <a href="add.html" class="btn primary">Add IOU</a>
            </div>

            <section class="card filters" aria-label="Search and filters">
                <div class="wide">
                    <label class="lbl" for="search">Search by person</label>
                    <input id="search" type="search" placeholder="Type a name...">
                </div>

                <div>
                    <label class="lbl" for="direction">Direction</label>
                    <select id="direction">
                        <option value="all">All</option>
                        <option value="in">Owes me</option>
                        <option value="out">I owe</option>
                    </select>
                </div>

                <div>
                    <label class="lbl" for="status">Status</label>
                    <select id="status">
                        <option value="all">All</option>
                        <option value="unpaid">Unpaid</option>
                        <option value="paid">Paid</option>
                    </select>
                </div>

                <button type="button" class="btn" id="clear-filters">Clear filters</button>
            </section>

            <!-- ious.js writes "Showing X of Y IOUs" here -->
            <p class="lbl" id="result-count" style="margin-bottom: 12px;">Showing 0 of 0 IOUs</p>

            <section class="card" aria-label="IOU list">
                <div class="tw">
                    <table>
                        <thead>
                            <tr><th>Person</th><th>Direction</th><th>Amount</th><th>Due</th><th>Note</th><th>Status</th><th>Actions</th></tr>
                        </thead>
                        <!-- ious.js fills this table body -->
                        <tbody id="iou-body"></tbody>
                    </table>
                </div>
            </section>

            <!-- ious.js shows a message here when there is nothing to list -->
            <p class="sub" id="empty-message" hidden></p>
        </div>
  </main>

    <footer>
      <div class="wrap">IOU Ledger. Your IOUs are saved in this browser only.</div>
    </footer>
<!-- javascript connection code -->
  <script src="storage.js"></script>
  <script src="ious.js"></script>
</body>
</html>
